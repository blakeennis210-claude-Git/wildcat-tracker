<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wildcats Live Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#242838;--fg:#f0f2f8;--fg2:#8b90a8;
  --green:#2ecc71;--red:#e74c3c;--gold:#f0a500;--accent:#4f7cff;--accent2:#7b5ea7;
  --border:rgba(255,255,255,0.09);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif;font-size:13px}
body{min-height:100vh;padding:max(10px,env(safe-area-inset-top,0px)) 0 max(16px,env(safe-area-inset-bottom,0px))}

/* ── top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;margin-bottom:8px;gap:8px}
.logo{font-weight:700;font-size:15px;letter-spacing:-.3px}
.logo span{color:var(--accent)}
.topbar-right{display:flex;gap:6px;align-items:center}
.btn-sm{background:var(--bg3);border:1px solid var(--border);color:var(--fg2);font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn-sm:disabled{opacity:.35;cursor:default}

/* ── auth ── */
#auth-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px 12px;margin-bottom:8px}
#auth-status{font-size:11px;color:var(--fg2)}
#auth-status.ok{color:var(--green)}
.btn-auth{background:var(--accent);color:#fff;border:none;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;padding:4px 12px;border-radius:6px;cursor:pointer}
.btn-auth.out{background:var(--bg3);color:var(--fg2);border:1px solid var(--border)}

/* ── game info ── */
.game-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px;margin-bottom:10px}
.gf{display:flex;flex-direction:column;gap:2px}
.gf label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--fg2)}
.gf input{background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--fg);font-family:'Space Grotesk',sans-serif;font-size:12px;padding:5px 8px;outline:none;width:100%}
.gf input:focus{border-color:var(--accent)}
.gf input::placeholder{color:var(--fg2)}

/* ── sheet wrapper — horizontal scroll ── */
.sheet-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}

/* ── stat sheet table ── */
table{border-collapse:collapse;min-width:max-content;width:100%}

/* header row */
thead th{background:var(--bg3);color:var(--fg2);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:6px 2px;text-align:center;border:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:2}
thead th.col-player{text-align:left;padding-left:8px;min-width:70px;background:var(--bg3);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}

/* player rows — clearly alternating */
tbody tr:nth-child(odd){background:#1a1d27}
tbody tr:nth-child(even){background:#0f1117}
tbody tr:nth-child(odd) td{border-color:rgba(255,255,255,.07)}
tbody tr:nth-child(even) td{border-color:rgba(255,255,255,.05)}
/* player column inherits row bg so stripe shows through */
tbody tr:nth-child(odd) .col-player{background:#242838}
tbody tr:nth-child(even) .col-player{background:#1a1d27}
.col-player{border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.player-info{display:flex;flex-direction:column;align-items:center;padding:4px 8px;min-width:62px}
.p-num{font-size:22px;font-weight:700;color:var(--fg);line-height:1.1}
.p-name{font-size:9px;font-weight:600;color:var(--fg2);line-height:1.2;white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}

/* stat cells */
td{border:1px solid var(--border);padding:2px;text-align:center;vertical-align:middle}
td.col-player{padding:0}

/* stat button */
.sbt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;min-height:52px;cursor:pointer;border-radius:6px;border:none;background:transparent;color:var(--fg);font-family:'Space Grotesk',sans-serif;touch-action:manipulation;gap:1px;width:100%;padding:3px}
.sbt:active{background:rgba(255,255,255,.12);transform:scale(.9)}
.sbt .cnt{font-size:20px;font-weight:700;line-height:1;min-width:24px}
.sbt .cnt.nonzero{color:var(--gold)}
.sbt .lbl{font-size:8px;font-weight:600;color:var(--fg2);letter-spacing:.3px;text-transform:uppercase}

/* shot cell — shows make/miss fraction */
.sbt.shot .shot-mk{color:var(--green);font-size:20px;font-weight:700;line-height:1}
.sbt.shot .shot-ms{color:var(--red);font-size:11px;font-weight:600;line-height:1}
.sbt.shot .shot-lbl{font-size:8px;font-weight:600;color:var(--fg2);letter-spacing:.3px;text-transform:uppercase}

/* make = green tint, miss = red tint */
.sbt.make .cnt.nonzero{color:var(--green)}
.sbt.miss .cnt.nonzero{color:var(--red)}
.sbt.reb  .cnt.nonzero{color:#4f7cff}
.sbt.wow  .cnt.nonzero{color:var(--gold)}
.sbt.neg  .cnt.nonzero{color:var(--red)}

/* make/miss picker popup */
#mm-popup{position:fixed;z-index:200;display:none;flex-direction:column;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 8px;box-shadow:0 8px 32px rgba(0,0,0,.6);min-width:120px}
#mm-popup.show{display:flex}
#mm-popup .mm-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2);text-align:center}
#mm-popup .mm-row{display:flex;gap:6px}
.mm-btn{flex:1;border:none;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;padding:9px 0;cursor:pointer;touch-action:manipulation;text-align:center}
.mm-btn.mk{background:rgba(46,204,113,.18);color:var(--green);border:1.5px solid var(--green)}
.mm-btn.mk:active{background:rgba(46,204,113,.4)}
.mm-btn.ms{background:rgba(231,76,60,.15);color:var(--red);border:1.5px solid var(--red)}
.mm-btn.ms:active{background:rgba(231,76,60,.35)}
.mm-btn.mm-cancel{background:var(--bg3);color:var(--fg2);border:1px solid var(--border);font-size:11px;padding:6px 0}
#mm-overlay{position:fixed;inset:0;z-index:199;display:none}
#mm-overlay.show{display:block}

/* flash animations */
@keyframes fg{0%{background:transparent}20%{background:rgba(46,204,113,.35)}100%{background:transparent}}
@keyframes fr{0%{background:transparent}20%{background:rgba(231,76,60,.3)}100%{background:transparent}}
@keyframes fb{0%{background:transparent}20%{background:rgba(79,124,255,.35)}100%{background:transparent}}
.flash-g{animation:fg .4s ease}
.flash-r{animation:fr .4s ease}
.flash-b{animation:fb .4s ease}

/* ── bottom totals row ── */
tfoot td{background:var(--bg3);font-weight:700;font-size:11px;text-align:center;padding:5px 2px;border:1px solid var(--border);color:var(--fg2)}
tfoot td.col-player{text-align:left;padding-left:8px;color:var(--fg);font-size:10px}
tfoot .tot-val{color:var(--fg)}

/* ── bottom section ── */
.bottom{padding:10px 12px;display:flex;flex-direction:column;gap:8px}

/* opp reb + live bar */
.opp-reb-row{display:flex;align-items:center;gap:10px}
.btn-opp{flex:1;background:rgba(231,76,60,.12);border:2px solid var(--red);border-radius:10px;color:var(--red);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;padding:9px 0;cursor:pointer;touch-action:manipulation;text-align:center}
.btn-opp:active{background:rgba(231,76,60,.3);transform:scale(.97)}
.opp-reb-count{font-size:22px;font-weight:700;color:var(--red);min-width:36px;text-align:center}

/* shooting summary */
.shot-summary{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.shot-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shot-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2);min-width:28px}
.shot-stat{font-size:12px;font-weight:600;white-space:nowrap}
.shot-stat .frac{color:var(--fg)}
.shot-stat .pct{font-size:10px}
.pct.good{color:var(--green)}.pct.mid{color:var(--gold)}.pct.bad{color:var(--red)}
.sdot{color:var(--border)}

/* reb bar */
.reb-bar-row{display:flex;align-items:center;gap:8px}
.reb-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2);min-width:28px}
.reb-n{font-size:15px;font-weight:700}
.reb-n.ours{color:var(--green)}.reb-n.opp{color:var(--red)}
.reb-wrap{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.reb-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--accent));transition:width .3s}

/* save */
.btn-save{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:11px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;padding:12px 0;cursor:pointer;touch-action:manipulation;letter-spacing:.3px}
.btn-save:disabled{opacity:.4;cursor:default}
.btn-save:active{opacity:.85}

/* toast */
#toast{position:fixed;bottom:max(70px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg3);color:var(--fg);font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;padding:8px 18px;border-radius:20px;border:1px solid var(--border);opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Wild<span>cats</span></div>
  <div class="topbar-right">
    <button class="btn-sm" id="btn-undo" disabled>↩ Undo</button>
  </div>
</div>

<div id="auth-bar">
  <span id="auth-status">Not signed in</span>
  <button class="btn-auth" id="btn-auth">Sign In</button>
</div>

<div class="game-info">
  <div class="gf"><label>Date</label><input type="date" id="game-date"></div>
  <div class="gf"><label>Opponent</label><input type="text" id="game-opp" placeholder="Opponent"></div>
  <div class="gf" style="grid-column:span 2"><label>Tournament</label><input type="text" id="game-tourn" placeholder="Tournament (optional)"></div>
</div>

<div class="sheet-wrap">
  <table id="stat-table">
    <thead>
      <tr>
        <th>LU</th>
        <th>MID</th>
        <th>3PT</th>
        <th>FT</th>
        <th class="col-player">Player</th>
        <th>WOW</th>
        <th>REB</th>
        <th>AST</th>
        <th>PC</th>
        <th>TO</th>
        <th>STL</th>
        <th>BLK</th>
        <th>TPI</th>
      </tr>
    </thead>
    <tbody id="stat-body"></tbody>
    <tfoot id="stat-foot"></tfoot>
  </table>
</div>

<div class="bottom">
  <div class="opp-reb-row">
    <button class="btn-opp" id="btn-opp-reb">🔴 OPP REBOUND</button>
    <div class="opp-reb-count" id="opp-reb-count">0</div>
  </div>

  <div class="shot-summary">
    <div class="shot-row">
      <span class="shot-lbl">FG</span>
      <span class="shot-stat"><span class="frac" id="sh-lu">0/0</span> <span class="pct" id="sh-lu-p">LU —</span></span>
      <span class="sdot">·</span>
      <span class="shot-stat"><span class="frac" id="sh-mid">0/0</span> <span class="pct" id="sh-mid-p">Mid —</span></span>
      <span class="sdot">·</span>
      <span class="shot-stat"><span class="frac" id="sh-3">0/0</span> <span class="pct" id="sh-3-p">3PT —</span></span>
      <span class="sdot">·</span>
      <span class="shot-stat"><span class="frac" id="sh-ft">0/0</span> <span class="pct" id="sh-ft-p">FT —</span></span>
    </div>
    <div class="reb-bar-row">
      <span class="reb-lbl">REB</span>
      <span class="reb-n ours" id="reb-ours">0</span>
      <div class="reb-wrap"><div class="reb-fill" id="reb-bar" style="width:50%"></div></div>
      <span class="reb-n opp" id="reb-opp">0</span>
    </div>
  </div>

  <button class="btn-save" id="btn-save">💾 Save Game to Stats Tracker</button>
</div>

<div id="mm-overlay"></div>
<div id="mm-popup">
  <div class="mm-title" id="mm-title">Shot</div>
  <div class="mm-row">
    <button class="mm-btn mk" id="mm-make">✓ Make</button>
    <button class="mm-btn ms" id="mm-miss">✗ Miss</button>
  </div>
  <button class="mm-btn mm-cancel" id="mm-cancel">Cancel</button>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyBbhBhuY1U57TN6qbIKVC378SitNepTe4M",
  authDomain:"wildcats-tracker.firebaseapp.com",
  projectId:"wildcats-tracker",
  storageBucket:"wildcats-tracker.firebasestorage.app",
  messagingSenderId:"663776602342",
  appId:"1:663776602342:web:39bf67df58ece64c86b327"
});
var db=firebase.firestore(), auth=firebase.auth();
var APPROVED=['seebee210@gmail.com','coachennisccf@gmail.com'];
var TEAM='wildcats2031', currentUser=null;
function isAuth(){ return currentUser && APPROVED.indexOf(currentUser.email)>-1; }

auth.onAuthStateChanged(function(u){
  currentUser=u;
  var s=document.getElementById('auth-status'), b=document.getElementById('btn-auth');
  if(u&&isAuth()){s.textContent='✓ '+u.email;s.className='ok';b.textContent='Sign Out';b.className='btn-auth out';}
  else if(u){s.textContent='Not authorized';s.className='';b.textContent='Sign Out';b.className='btn-auth out';}
  else{s.textContent='Not signed in';s.className='';b.textContent='Sign In';b.className='btn-auth';}
});
document.getElementById('btn-auth').addEventListener('click',function(){
  currentUser?auth.signOut():auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(){showToast('Sign in failed',true);});
});

var ROSTER=[
  {num:'25',name:'Twin'},{num:'23',name:'El'},{num:'10',name:'Maria'},
  {num:'2',name:'Izzy'},{num:'30',name:'Avarie'},{num:'12',name:'Laylah'},
  {num:'00',name:'Everly'},{num:'21',name:'Jazzy'},{num:'7',name:'Mac'},
  {num:'24',name:'Arya'},{num:'5',name:'Bella'}
];

// stat keys per player
var KEYS=['layup_make','layup_miss','middy_make','middy_miss','three_make','three_miss','ft_make','ft_miss','reb','ast','stl','blk','pc','to','wow'];
var stats={};
ROSTER.forEach(function(p){
  stats[p.name]={};
  KEYS.forEach(function(k){stats[p.name][k]=0;});
});
var oppRebs=0, gameLog=[];

function calcPts(s){return s.layup_make*2+s.middy_make*2+s.three_make*3+s.ft_make;}
function calcOPI(s){return calcPts(s)+s.ast*0.5+s.pc*1.0-s.to*1.0;}
function calcDPI(s){return s.reb*1.0+s.stl*1.2+s.blk*1.2+s.wow*2.0;}

// shot col definitions: [makeKey, missKey, label]
var SHOT_COLS=[
  ['layup_make','layup_miss','LU'],
  ['middy_make','middy_miss','MID'],
  ['three_make','three_miss','3PT'],
  ['ft_make','ft_miss','FT']
];
var STAT_COLS=[
  ['wow','WOW','wow'],['reb','REB','reb'],['ast','AST',''],
  ['pc','PC',''],['to','TO','neg'],['stl','STL',''],['blk','BLK','']
];
// COLS for totals/refreshTotals — flat list of all keys
var COLS=[];
SHOT_COLS.forEach(function(sc){COLS.push([sc[0],'',''],[sc[1],'','']);});
STAT_COLS.forEach(function(c){COLS.push(c);});

// make/miss picker
var mmPending=null;
var mmPopup=document.getElementById('mm-popup');
var mmOverlay=document.getElementById('mm-overlay');
function openMM(playerName, makeKey, missKey, label, anchorEl){
  mmPending={playerName:playerName,makeKey:makeKey,missKey:missKey};
  document.getElementById('mm-title').textContent=label;
  // position near the tapped cell
  var r=anchorEl.getBoundingClientRect();
  var top=r.bottom+6, left=r.left;
  if(top+120>window.innerHeight) top=r.top-130;
  if(left+130>window.innerWidth) left=window.innerWidth-138;
  if(left<4) left=4;
  mmPopup.style.top=top+'px'; mmPopup.style.left=left+'px';
  mmPopup.classList.add('show'); mmOverlay.classList.add('show');
}
function closeMM(){ mmPopup.classList.remove('show'); mmOverlay.classList.remove('show'); mmPending=null; }
document.getElementById('mm-make').addEventListener('click',function(){
  if(!mmPending)return; var p=mmPending; closeMM(); commitStat(p.playerName,p.makeKey,false);
});
document.getElementById('mm-miss').addEventListener('click',function(){
  if(!mmPending)return; var p=mmPending; closeMM(); commitStat(p.playerName,p.missKey,true);
});
document.getElementById('mm-cancel').addEventListener('click',closeMM);
mmOverlay.addEventListener('click',closeMM);

function makeShotCell(p, sc){
  var makeKey=sc[0], missKey=sc[1], label=sc[2];
  var td=document.createElement('td');
  var btn=document.createElement('button');
  btn.className='sbt shot';
  btn.innerHTML='<span class="shot-mk" id="sm-'+p.name+'-'+makeKey+'">0</span>'
               +'<span class="shot-ms" id="sx-'+p.name+'-'+missKey+'">0✗</span>'
               +'<span class="shot-lbl">'+label+'</span>';
  btn.addEventListener('click',function(e){e.stopPropagation();openMM(p.name,makeKey,missKey,label,btn);});
  td.appendChild(btn);
  return td;
}

function makeStatCell(p, col){
  var key=col[0], cls=col[2];
  var td=document.createElement('td');
  td.dataset.player=p.name; td.dataset.key=key;
  var btn=document.createElement('button');
  btn.className='sbt '+(cls||'');
  btn.innerHTML='<span class="cnt" id="c-'+p.name+'-'+key+'">0</span>';
  btn.addEventListener('click',function(e){e.stopPropagation();commitStat(p.name,key,false);});
  td.appendChild(btn);
  return td;
}

// build table
var tbody=document.getElementById('stat-body');
ROSTER.forEach(function(p){
  var tr=document.createElement('tr');

  // shot cells (left side)
  SHOT_COLS.forEach(function(sc){ tr.appendChild(makeShotCell(p,sc)); });

  // player name cell (center sticky)
  var tdp=document.createElement('td');
  tdp.className='col-player';
  tdp.innerHTML='<div class="player-info"><div class="p-num">#'+p.num+'</div><div class="p-name">'+p.name+'</div></div>';
  tr.appendChild(tdp);

  // stat cells (right side)
  STAT_COLS.forEach(function(col){ tr.appendChild(makeStatCell(p,col)); });

  // TPI cell (read-only)
  var tdtpi=document.createElement('td');
  tdtpi.id='tpi-'+p.name;
  tdtpi.style.cssText='font-weight:700;font-size:13px;color:var(--gold);text-align:center;min-width:36px;padding:4px 2px';
  tdtpi.textContent='0.0';
  tr.appendChild(tdtpi);

  tbody.appendChild(tr);
});

// build totals footer
var tfoot=document.getElementById('stat-foot');
var tfr=document.createElement('tr');
// shot totals (left) — one cell per shot type showing makes
SHOT_COLS.forEach(function(sc){
  var td=document.createElement('td');
  td.id='tot-shot-'+sc[0];
  td.innerHTML='<span class="tot-val" style="color:var(--green)">0</span><span style="color:var(--red);font-size:9px"> /0</span>';
  tfr.appendChild(td);
});
// player label (center)
var tftd=document.createElement('td');
tftd.className='col-player'; tftd.textContent='TOTALS';
tfr.appendChild(tftd);
// stat totals (right)
STAT_COLS.forEach(function(col){
  var td=document.createElement('td');
  td.id='tot-'+col[0];
  td.innerHTML='<span class="tot-val">0</span>';
  tfr.appendChild(td);
});
// TPI total
var tdttpi=document.createElement('td');
tdttpi.id='tot-tpi';
tdttpi.style.cssText='font-weight:700;font-size:12px;color:var(--gold)';
tdttpi.textContent='0.0';
tfr.appendChild(tdttpi);
tfoot.appendChild(tfr);

function refreshRow(name){
  var s=stats[name];
  // shot cells
  SHOT_COLS.forEach(function(sc){
    var mk=document.getElementById('sm-'+name+'-'+sc[0]);
    var ms=document.getElementById('sx-'+name+'-'+sc[1]);
    if(mk) mk.textContent=s[sc[0]];
    if(ms) ms.textContent=s[sc[1]]+'✗';
  });
  // stat cells
  STAT_COLS.forEach(function(col){
    var el=document.getElementById('c-'+name+'-'+col[0]);
    if(!el)return;
    el.textContent=s[col[0]];
    el.className='cnt'+(s[col[0]]>0?' nonzero':'');
  });
  var opi=calcOPI(s), dpi=calcDPI(s), tpi=opi+dpi;
  var tpiEl=document.getElementById('tpi-'+name);
  if(tpiEl) tpiEl.textContent=tpi.toFixed(1);
  refreshTotals();
}

function refreshTotals(){
  // shot totals
  SHOT_COLS.forEach(function(sc){
    var tm=0,ta=0;
    ROSTER.forEach(function(p){tm+=stats[p.name][sc[0]];ta+=stats[p.name][sc[1]];});
    var el=document.getElementById('tot-shot-'+sc[0]);
    if(el){el.querySelector('.tot-val').textContent=tm;el.querySelector('span:last-child').textContent=' /'+ta;}
  });
  // stat totals
  STAT_COLS.forEach(function(col){
    var k=col[0], tot=0;
    ROSTER.forEach(function(p){tot+=stats[p.name][k];});
    var el=document.getElementById('tot-'+k);
    if(el) el.querySelector('.tot-val').textContent=tot;
  });
  var totalTpi=0;
  ROSTER.forEach(function(p){totalTpi+=calcOPI(stats[p.name])+calcDPI(stats[p.name]);});
  var ttpi=document.getElementById('tot-tpi');
  if(ttpi) ttpi.textContent=totalTpi.toFixed(1);
  refreshBar();
}

function flashCell(name, key, cls){
  // try stat cell first, then shot cell span
  var el=document.getElementById('c-'+name+'-'+key)
      ||document.getElementById('sm-'+name+'-'+key)
      ||document.getElementById('sx-'+name+'-'+key);
  if(!el)return;
  var td=el.closest('td');
  if(!td)return;
  td.classList.remove('flash-g','flash-r','flash-b');
  void td.offsetWidth;
  td.classList.add(cls);
}

function commitStat(name, key, isMiss){
  var prev=JSON.parse(JSON.stringify(stats[name]));
  stats[name][key]++;
  gameLog.push({player:name,key:key,prev:prev,oppBefore:oppRebs});
  refreshRow(name);
  var isReb=key==='reb';
  var miss=isMiss||key==='to';
  flashCell(name,key,isReb?'flash-b':miss?'flash-r':'flash-g');
  document.getElementById('btn-undo').disabled=false;
}

function commitOppReb(){
  gameLog.push({player:null,key:'opp_reb',oppBefore:oppRebs});
  oppRebs++;
  document.getElementById('opp-reb-count').textContent=oppRebs;
  refreshBar();
  document.getElementById('btn-undo').disabled=false;
  showToast('Opp Rebound');
}

document.getElementById('btn-undo').addEventListener('click',function(){
  if(!gameLog.length)return;
  var last=gameLog.pop();
  if(last.player===null){oppRebs=last.oppBefore;document.getElementById('opp-reb-count').textContent=oppRebs;refreshBar();}
  else{stats[last.player]=last.prev;refreshRow(last.player);}
  if(!gameLog.length) document.getElementById('btn-undo').disabled=true;
});

document.getElementById('btn-opp-reb').addEventListener('click',commitOppReb);

function refreshBar(){
  var ourR=0,lm=0,la=0,mm=0,ma=0,tm=0,ta=0,fm=0,fa=0;
  ROSTER.forEach(function(p){
    var s=stats[p.name];
    ourR+=s.reb;
    lm+=s.layup_make; la+=s.layup_make+s.layup_miss;
    mm+=s.middy_make; ma+=s.middy_make+s.middy_miss;
    tm+=s.three_make; ta+=s.three_make+s.three_miss;
    fm+=s.ft_make;    fa+=s.ft_make+s.ft_miss;
  });
  document.getElementById('reb-ours').textContent=ourR;
  document.getElementById('reb-opp').textContent=oppRebs;
  var tot=ourR+oppRebs;
  document.getElementById('reb-bar').style.width=(tot===0?50:Math.round(ourR/tot*100))+'%';
  function pc(m,a){if(!a)return'';var p=m/a;return p>=0.5?'good':p>=0.33?'mid':'bad';}
  function set(fi,pi,m,a,lbl){
    document.getElementById(fi).textContent=m+'/'+a;
    var el=document.getElementById(pi);
    el.textContent=lbl+' '+(a?Math.round(m/a*100)+'%':'—');
    el.className='pct '+pc(m,a);
  }
  set('sh-lu','sh-lu-p',lm,la,'LU');
  set('sh-mid','sh-mid-p',mm,ma,'Mid');
  set('sh-3','sh-3-p',tm,ta,'3PT');
  set('sh-ft','sh-ft-p',fm,fa,'FT');
}

// save
document.getElementById('btn-save').addEventListener('click',function(){
  if(!isAuth()){showToast('Sign in first',true);return;}
  var opp=document.getElementById('game-opp').value.trim();
  if(!opp){showToast('Enter opponent name',true);return;}
  var date=document.getElementById('game-date').value||new Date().toISOString().slice(0,10);
  var tourn=document.getElementById('game-tourn').value.trim();
  var lm=0,la=0,mm=0,ma=0,tm=0,ta=0,fm=0,fa=0,tStl=0,tTo=0,tReb=0;
  ROSTER.forEach(function(p){
    var s=stats[p.name];
    lm+=s.layup_make;la+=s.layup_make+s.layup_miss;
    mm+=s.middy_make;ma+=s.middy_make+s.middy_miss;
    tm+=s.three_make;ta+=s.three_make+s.three_miss;
    fm+=s.ft_make;fa+=s.ft_make+s.ft_miss;
    tStl+=s.stl;tTo+=s.to;tReb+=s.reb;
  });
  var fgm=lm+mm+tm,fga=la+ma+ta,pts=lm*2+mm*2+tm*3+fm;
  var game={id:Date.now(),team:TEAM,opp:opp,date:date,tournament:tourn,
    lm:lm,la:la,midm:mm,mida:ma,csm:tm,csa:ta,opm:0,opa:0,
    fm:fm,fa:fa,tcr:tStl,tco:tTo,rwc:tReb,rop:oppRebs,
    pts:pts,fgm:fgm,fga:fga,t3m:tm,t3a:ta,
    efg:fga===0?null:Math.round((fgm+0.5*tm)/fga*100)};
  var recs=ROSTER.map(function(p){
    var s=stats[p.name];
    return{team:TEAM,opp:opp,date:date,tournament:tourn,
      playerNum:p.num,playerName:p.name,
      layupm:s.layup_make,layupa:s.layup_make+s.layup_miss,
      ftm:s.ft_make,fta:s.ft_make+s.ft_miss,
      threem:s.three_make,threea:s.three_make+s.three_miss,
      midm:s.middy_make,mida:s.middy_make+s.middy_miss,
      reb:s.reb,ast:s.ast,pc:s.pc,blk:s.blk,
      tocr:s.stl,toco:s.to,wow:s.wow,
      pts:s.layup_make*2+s.ft_make+s.three_make*3+s.middy_make*2,
      oppReb:oppRebs,savedAt:Date.now()};
  });
  var btn=document.getElementById('btn-save');
  btn.disabled=true;btn.textContent='Saving…';
  db.collection('games').add(game).then(function(){
    return Promise.all(recs.map(function(r){return db.collection('playerStats').add(r);}));
  }).then(function(){
    btn.disabled=false;btn.textContent='✓ Saved!';
    showToast('Saved vs '+opp+'!');
    setTimeout(function(){btn.textContent='💾 Save Game to Stats Tracker';},3000);
  }).catch(function(e){
    btn.disabled=false;btn.textContent='💾 Save Game to Stats Tracker';
    showToast('Save failed: '+e.message,true);
  });
});

function showToast(msg,err){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='show'+(err?' err':'');
  clearTimeout(t._t);t._t=setTimeout(function(){t.className='';},1800);
}

document.getElementById('game-date').value=new Date().toISOString().slice(0,10);
</script>
</body>
