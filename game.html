<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wildcats Live Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#242838;--fg:#f0f2f8;--fg2:#8b90a8;
  --green:#2ecc71;--red:#e74c3c;--gold:#f0a500;--accent:#4f7cff;--accent2:#7b5ea7;
  --border:rgba(255,255,255,0.09);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif;font-size:13px}
body{min-height:100vh;padding:max(10px,env(safe-area-inset-top,0px)) 0 max(16px,env(safe-area-inset-bottom,0px))}

/* ── team select screen ── */
#team-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px}
#team-screen.hidden{display:none}
.ts-logo{font-size:36px;font-weight:800;letter-spacing:-1px;color:var(--fg)}
.ts-logo span{color:var(--accent)}
.ts-sub{font-size:12px;color:var(--fg2);text-transform:uppercase;letter-spacing:1px}
.ts-label{font-size:11px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:-12px}
.ts-teams{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.ts-btn{background:var(--bg3);border:2px solid var(--border);color:var(--fg);font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;padding:16px 0;border-radius:12px;cursor:pointer;touch-action:manipulation;text-align:center}
.ts-btn:active{background:var(--accent);border-color:var(--accent);transform:scale(.97)}

.hidden{display:none!important}

/* ── top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;margin-bottom:8px;gap:8px}
.logo{font-weight:700;font-size:15px;letter-spacing:-.3px}
.logo span{color:var(--accent)}
.btn-sm{background:var(--bg3);border:1px solid var(--border);color:var(--fg2);font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn-sm:disabled{opacity:.35;cursor:default}

/* ── auth ── */
#auth-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px 12px;margin-bottom:8px}
#auth-status{font-size:11px;color:var(--fg2)}
#auth-status.ok{color:var(--green)}
.btn-auth{background:var(--accent);color:#fff;border:none;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;padding:4px 12px;border-radius:6px;cursor:pointer}
.btn-auth.out{background:var(--bg3);color:var(--fg2);border:1px solid var(--border)}

/* ── game info ── */
.game-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px;margin-bottom:10px}
.gf{display:flex;flex-direction:column;gap:2px}
.gf label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--fg2)}
.gf input{background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--fg);font-family:'Space Grotesk',sans-serif;font-size:12px;padding:5px 8px;outline:none;width:100%}
.gf input:focus{border-color:var(--accent)}
.gf input::placeholder{color:var(--fg2)}

/* ── tracker table ── */
.sheet-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
table.tracker{border-collapse:collapse;min-width:max-content;width:100%}
table.tracker thead th{
  background:var(--bg3);color:var(--fg);font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.3px;padding:8px 4px;
  text-align:center;border:1px solid var(--border);white-space:nowrap;
  position:sticky;top:0;z-index:2}
table.tracker thead th.col-player{
  text-align:left;padding-left:8px;min-width:70px;
  border-left:3px solid var(--accent);border-right:3px solid var(--accent)}

/* alternating rows */
table.tracker tbody tr:nth-child(odd){background:#ffffff;color:#111}
table.tracker tbody tr:nth-child(even){background:#111111;color:#fff}
table.tracker tbody tr:nth-child(odd) td{border-color:rgba(0,0,0,.12)}
table.tracker tbody tr:nth-child(even) td{border-color:rgba(255,255,255,.1)}
table.tracker tbody td{border:1px solid var(--border);padding:2px;text-align:center;vertical-align:middle}
table.tracker tbody td.col-player{padding:0;border-left:3px solid var(--accent);border-right:3px solid var(--accent)}
table.tracker tbody tr:nth-child(odd) .col-player{background:#e0e0e0}
table.tracker tbody tr:nth-child(even) .col-player{background:#1c1c1c}

/* player cell */
.player-info{display:flex;flex-direction:column;align-items:center;padding:4px 10px;min-width:66px}
.p-num{font-size:24px;font-weight:700;line-height:1.1}
table.tracker tbody tr:nth-child(odd) .p-num{color:#111}
table.tracker tbody tr:nth-child(even) .p-num{color:#fff}
.p-name{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;line-height:1.2;white-space:nowrap}
table.tracker tbody tr:nth-child(odd) .p-name{color:#555}
table.tracker tbody tr:nth-child(even) .p-name{color:#aaa}

/* tap buttons — label only, no counts */
.sbt{display:flex;align-items:center;justify-content:center;
  min-width:52px;min-height:54px;cursor:pointer;border-radius:7px;border:none;
  background:transparent;font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:14px;touch-action:manipulation;width:100%;padding:4px;letter-spacing:.3px}
table.tracker tbody tr:nth-child(odd) .sbt{color:#111}
table.tracker tbody tr:nth-child(even) .sbt{color:#fff}
.sbt:active{opacity:.5;transform:scale(.88)}

/* flash */
@keyframes fg{0%{background:transparent}20%{background:rgba(46,204,113,.5)}100%{background:transparent}}
@keyframes fr{0%{background:transparent}20%{background:rgba(231,76,60,.45)}100%{background:transparent}}
@keyframes fb{0%{background:transparent}20%{background:rgba(79,124,255,.5)}100%{background:transparent}}
.flash-g{animation:fg .35s ease}
.flash-r{animation:fr .35s ease}
.flash-b{animation:fb .35s ease}

/* ── make/miss picker ── */
#mm-overlay{position:fixed;inset:0;z-index:199;display:none}
#mm-overlay.show{display:block}
#mm-popup{position:fixed;z-index:200;display:none;flex-direction:column;gap:8px;
  background:#1e2130;border:1px solid rgba(255,255,255,.15);border-radius:14px;
  padding:12px 10px;box-shadow:0 12px 40px rgba(0,0,0,.7);min-width:140px}
#mm-popup.show{display:flex}
#mm-popup .mm-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#8b90a8;text-align:center}
#mm-popup .mm-row{display:flex;gap:8px}
.mm-btn{flex:1;border:none;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;padding:11px 0;cursor:pointer;touch-action:manipulation;text-align:center}
.mm-btn.mk{background:rgba(46,204,113,.2);color:#2ecc71;border:2px solid #2ecc71}
.mm-btn.mk:active{background:rgba(46,204,113,.45)}
.mm-btn.ms{background:rgba(231,76,60,.18);color:#e74c3c;border:2px solid #e74c3c}
.mm-btn.ms:active{background:rgba(231,76,60,.4)}
.mm-btn.mm-cancel{background:var(--bg3);color:var(--fg2);border:1px solid var(--border);font-size:11px;padding:7px 0}

/* ── bottom section ── */
.bottom{padding:10px 12px;display:flex;flex-direction:column;gap:10px}

/* opp reb */
.opp-reb-row{display:flex;align-items:center;gap:10px}
.btn-opp{flex:1;background:rgba(231,76,60,.12);border:2px solid var(--red);border-radius:10px;color:var(--red);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;padding:9px 0;cursor:pointer;touch-action:manipulation;text-align:center}
.btn-opp:active{background:rgba(231,76,60,.3);transform:scale(.97)}
.opp-reb-count{font-size:22px;font-weight:700;color:var(--red);min-width:36px;text-align:center}

/* ── per-player summary table ── */
.summary-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--fg2);padding:0 2px}
.summary-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.summary{border-collapse:collapse;min-width:max-content;width:100%}
table.summary th{background:var(--bg3);color:var(--fg);font-size:11px;font-weight:700;
  text-transform:uppercase;padding:6px 6px;text-align:center;border:1px solid var(--border);white-space:nowrap}
table.summary th.sh{text-align:left;padding-left:8px;min-width:80px}
table.summary td{background:var(--bg2);color:var(--fg);font-size:13px;font-weight:600;
  text-align:center;padding:5px 6px;border:1px solid var(--border)}
table.summary td.sh{text-align:left;padding-left:8px;font-size:11px;white-space:nowrap}
table.summary td.tpi-val{color:var(--gold);font-weight:700}
table.summary td.zero{color:var(--fg2);font-weight:400}
table.summary tr.tot-row td{background:var(--bg3);color:var(--fg);font-weight:700;font-size:12px}
table.summary tr.tot-row td.sh{color:var(--fg2)}

/* shooting summary bar */
.shot-summary{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.shot-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shot-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2);min-width:28px}
.shot-stat{font-size:12px;font-weight:600;white-space:nowrap}
.pct.good{color:var(--green)}.pct.mid{color:var(--gold)}.pct.bad{color:var(--red)}
.sdot{color:var(--border)}
.reb-bar-row{display:flex;align-items:center;gap:8px}
.reb-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2);min-width:28px}
.reb-n{font-size:15px;font-weight:700}
.reb-n.ours{color:var(--green)}.reb-n.opp{color:var(--red)}
.reb-wrap{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.reb-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--accent));transition:width .3s}

/* save */
.btn-save{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:11px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;padding:12px 0;cursor:pointer;touch-action:manipulation;letter-spacing:.3px}
.btn-save:disabled{opacity:.4;cursor:default}
.btn-save:active{opacity:.85}

/* toast */
#toast{position:fixed;bottom:max(70px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg3);color:var(--fg);font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;padding:8px 18px;border-radius:20px;border:1px solid var(--border);opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<div id="team-screen">
  <div class="ts-logo">Wild<span>cats</span></div>
  <div class="ts-sub">Live Game Tracker</div>
  <div class="ts-label">Who's playing?</div>
  <div class="ts-teams">
    <button class="ts-btn" onclick="selectTeam('2031')">Class of 2031</button>
    <button class="ts-btn" onclick="selectTeam('2032')">Class of 2032</button>
    <button class="ts-btn" onclick="selectTeam('2033')">Class of 2033</button>
  </div>
</div>

<div id="tracker-wrap" class="hidden">
<div class="topbar">
  <div class="logo">Wild<span>cats</span></div>
  <div>
    <button class="btn-sm" id="btn-undo" disabled>↩ Undo</button>
  </div>
</div>

<div id="auth-bar">
  <span id="auth-status">Not signed in</span>
  <button class="btn-auth" id="btn-auth">Sign In</button>
</div>

<div class="game-info">
  <div class="gf"><label>Date</label><input type="date" id="game-date"></div>
  <div class="gf"><label>Opponent</label><input type="text" id="game-opp" placeholder="Opponent"></div>
  <div class="gf" style="grid-column:span 2"><label>Tournament</label><input type="text" id="game-tourn" placeholder="Tournament (optional)"></div>
</div>

<!-- tracker: tap buttons only, no counts -->
<div class="sheet-wrap">
  <table class="tracker" id="stat-table">
    <thead>
      <tr>
        <th>LU</th><th>MID</th><th>3PT</th><th>FT</th>
        <th class="col-player">Player</th>
        <th>WOW</th><th>REB</th><th>AST</th><th>PC</th><th>TO</th><th>STL</th><th>BLK</th>
      </tr>
    </thead>
    <tbody id="stat-body"></tbody>
  </table>
</div>

<div class="bottom">
  <div class="opp-reb-row">
    <button class="btn-opp" id="btn-opp-reb">🔴 OPP REBOUND</button>
    <div class="opp-reb-count" id="opp-reb-count">0</div>
  </div>

  <!-- per-player stat summary -->
  <div class="summary-title">Game Stats</div>
  <div class="summary-wrap">
    <table class="summary">
      <thead>
        <tr>
          <th class="sh">Player</th>
          <th>LU</th><th>MID</th><th>3PT</th><th>FT</th>
          <th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>PC</th><th>TO</th><th>WOW</th>
          <th>TPI</th>
        </tr>
      </thead>
      <tbody id="summary-body"></tbody>
      <tfoot id="summary-foot"></tfoot>
    </table>
  </div>

  <!-- shooting % bar -->
  <div class="shot-summary">
    <div class="shot-row">
      <span class="shot-lbl">FG</span>
      <span class="shot-stat"><span id="sh-lu">0/0</span> <span class="pct" id="sh-lu-p">LU —</span></span>
      <span class="sdot">·</span>
      <span class="shot-stat"><span id="sh-mid">0/0</span> <span class="pct" id="sh-mid-p">Mid —</span></span>
      <span class="sdot">·</span>
      <span class="shot-stat"><span id="sh-3">0/0</span> <span class="pct" id="sh-3-p">3PT —</span></span>
      <span class="sdot">·</span>
      <span class="shot-stat"><span id="sh-ft">0/0</span> <span class="pct" id="sh-ft-p">FT —</span></span>
    </div>
    <div class="reb-bar-row">
      <span class="reb-lbl">REB</span>
      <span class="reb-n ours" id="reb-ours">0</span>
      <div class="reb-wrap"><div class="reb-fill" id="reb-bar" style="width:50%"></div></div>
      <span class="reb-n opp" id="reb-opp">0</span>
    </div>
  </div>

  <button class="btn-save" id="btn-save">💾 Save Game to Stats Tracker</button>
</div>

</div><!-- end tracker-wrap -->

<div id="mm-overlay"></div>
<div id="mm-popup">
  <div class="mm-title" id="mm-title">Shot</div>
  <div class="mm-row">
    <button class="mm-btn mk" id="mm-make">✓ Make</button>
    <button class="mm-btn ms" id="mm-miss">✗ Miss</button>
  </div>
  <button class="mm-btn mm-cancel" id="mm-cancel">Cancel</button>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyBbhBhuY1U57TN6qbIKVC378SitNepTe4M",
  authDomain:"wildcats-tracker.firebaseapp.com",
  projectId:"wildcats-tracker",
  storageBucket:"wildcats-tracker.firebasestorage.app",
  messagingSenderId:"663776602342",
  appId:"1:663776602342:web:39bf67df58ece64c86b327"
});
var db=firebase.firestore(), auth=firebase.auth();
var APPROVED=['seebee210@gmail.com','coachennisccf@gmail.com'];
var TEAM='2031', currentUser=null;

var ROSTERS={
  '2031':[
    {num:'25',name:'Twin'},{num:'23',name:'El'},{num:'10',name:'Maria'},
    {num:'2',name:'Izzy'},{num:'30',name:'Avarie'},{num:'12',name:'Laylah'},
    {num:'00',name:'Everly'},{num:'21',name:'Jazzy'},{num:'7',name:'Mac'},
    {num:'24',name:'Arya'},{num:'5',name:'Bella'}
  ],
  '2032':[
    {num:'10',name:'Maria'},{num:'00',name:'Everly'},{num:'1',name:'Mia'},
    {num:'21',name:'Jazzy'},{num:'7',name:'Mac'},{num:'11',name:'Brooklyn'},
    {num:'5',name:'Bella'}
  ],
  '2033':[
    {num:'7',name:'Mac'},{num:'11',name:'Brooklyn'},{num:'5',name:'Bella'},
    {num:'9',name:'Jyzelle'},{num:'24',name:'Arya'},{num:'20',name:'Ky'},
    {num:'10',name:'Issaly'}
  ]
};

window.selectTeam=function(id){
  TEAM=id;
  ROSTER=ROSTERS[id]||[];
  document.getElementById('team-screen').classList.add('hidden');
  document.getElementById('tracker-wrap').classList.remove('hidden');
  // reset state
  stats={};
  ROSTER.forEach(function(p){ stats[p.name]={}; KEYS.forEach(function(k){stats[p.name][k]=0;}); });
  oppRebs=0; gameLog=[];
  document.getElementById('opp-reb-count').textContent='0';
  document.getElementById('btn-undo').disabled=true;
  buildTable();
  buildSummary();
  refreshSummary();
};
function isAuth(){ return currentUser && APPROVED.indexOf(currentUser.email)>-1; }

auth.onAuthStateChanged(function(u){
  currentUser=u;
  var s=document.getElementById('auth-status'), b=document.getElementById('btn-auth');
  if(u&&isAuth()){s.textContent='✓ '+u.email;s.className='ok';b.textContent='Sign Out';b.className='btn-auth out';}
  else if(u){s.textContent='Not authorized';s.className='';b.textContent='Sign Out';b.className='btn-auth out';}
  else{s.textContent='Not signed in';s.className='';b.textContent='Sign In';b.className='btn-auth';}
});
document.getElementById('btn-auth').addEventListener('click',function(){
  currentUser?auth.signOut():auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(){showToast('Sign in failed',true);});
});

var ROSTER=[
  {num:'25',name:'Twin'},{num:'23',name:'El'},{num:'10',name:'Maria'},
  {num:'2',name:'Izzy'},{num:'30',name:'Avarie'},{num:'12',name:'Laylah'},
  {num:'00',name:'Everly'},{num:'21',name:'Jazzy'},{num:'7',name:'Mac'},
  {num:'24',name:'Arya'},{num:'5',name:'Bella'}
];

var KEYS=['layup_make','layup_miss','middy_make','middy_miss','three_make','three_miss','ft_make','ft_miss','reb','ast','stl','blk','pc','to','wow'];
var stats={};
ROSTER.forEach(function(p){ stats[p.name]={}; KEYS.forEach(function(k){stats[p.name][k]=0;}); });
var oppRebs=0, gameLog=[];

function calcPts(s){return s.layup_make*2+s.middy_make*2+s.three_make*3+s.ft_make;}
function calcOPI(s){return calcPts(s)+s.ast*0.5+s.pc*1.0-s.to*1.0;}
function calcDPI(s){return s.reb*1.0+s.stl*1.2+s.blk*1.2+s.wow*2.0;}

var SHOT_COLS=[
  ['layup_make','layup_miss','LU'],
  ['middy_make','middy_miss','MID'],
  ['three_make','three_miss','3PT'],
  ['ft_make','ft_miss','FT']
];
var STAT_COLS=[['wow','WOW'],['reb','REB'],['ast','AST'],['pc','PC'],['to','TO'],['stl','STL'],['blk','BLK']];

/* ── make/miss picker ── */
var mmPending=null;
var mmPopup=document.getElementById('mm-popup');
var mmOverlay=document.getElementById('mm-overlay');
function openMM(playerName,makeKey,missKey,label,anchorEl){
  mmPending={playerName:playerName,makeKey:makeKey,missKey:missKey};
  document.getElementById('mm-title').textContent=label;
  var r=anchorEl.getBoundingClientRect();
  var top=r.bottom+6, left=r.left;
  if(top+140>window.innerHeight) top=r.top-148;
  if(left+150>window.innerWidth) left=window.innerWidth-156;
  if(left<4) left=4;
  mmPopup.style.top=top+'px'; mmPopup.style.left=left+'px';
  mmPopup.classList.add('show'); mmOverlay.classList.add('show');
}
function closeMM(){ mmPopup.classList.remove('show'); mmOverlay.classList.remove('show'); mmPending=null; }
document.getElementById('mm-make').addEventListener('click',function(){
  if(!mmPending)return; var p=mmPending; closeMM(); commitStat(p.playerName,p.makeKey,false);
});
document.getElementById('mm-miss').addEventListener('click',function(){
  if(!mmPending)return; var p=mmPending; closeMM(); commitStat(p.playerName,p.missKey,true);
});
document.getElementById('mm-cancel').addEventListener('click',closeMM);
mmOverlay.addEventListener('click',closeMM);

/* ── build tracker table ── */
function buildTable(){
  var tbody=document.getElementById('stat-body');
  tbody.innerHTML='';
  ROSTER.forEach(function(p){
    var tr=document.createElement('tr');
    SHOT_COLS.forEach(function(sc){
      var td=document.createElement('td');
      var btn=document.createElement('button');
      btn.className='sbt';
      btn.textContent=sc[2];
      btn.addEventListener('click',function(e){e.stopPropagation();openMM(p.name,sc[0],sc[1],sc[2],btn);});
      td.appendChild(btn); tr.appendChild(td);
    });
    var tdp=document.createElement('td');
    tdp.className='col-player';
    tdp.innerHTML='<div class="player-info"><div class="p-num">'+p.num+'</div><div class="p-name">'+p.name+'</div></div>';
    tr.appendChild(tdp);
    STAT_COLS.forEach(function(sc){
      var key=sc[0], lbl=sc[1];
      var td=document.createElement('td');
      var btn=document.createElement('button');
      btn.className='sbt';
      btn.textContent=lbl;
      btn.addEventListener('click',function(e){e.stopPropagation();commitStat(p.name,key,key==='to');});
      td.appendChild(btn); tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

/* ── build summary table ── */
function buildSummary(){
  var sbody=document.getElementById('summary-body');
  sbody.innerHTML='';
  ROSTER.forEach(function(p){
    var tr=document.createElement('tr');
    tr.innerHTML='<td class="sh">'+p.num+' '+p.name+'</td>'
      +'<td id="su-lu-'+p.name+'">0/0</td>'
      +'<td id="su-mid-'+p.name+'">0/0</td>'
      +'<td id="su-3-'+p.name+'">0/0</td>'
      +'<td id="su-ft-'+p.name+'">0/0</td>'
      +'<td id="su-pts-'+p.name+'">0</td>'
      +'<td id="su-reb-'+p.name+'">0</td>'
      +'<td id="su-ast-'+p.name+'">0</td>'
      +'<td id="su-stl-'+p.name+'">0</td>'
      +'<td id="su-blk-'+p.name+'">0</td>'
      +'<td id="su-pc-'+p.name+'">0</td>'
      +'<td id="su-to-'+p.name+'">0</td>'
      +'<td id="su-wow-'+p.name+'">0</td>'
      +'<td class="tpi-val" id="su-tpi-'+p.name+'">0.0</td>';
    sbody.appendChild(tr);
  });
  var sfoot=document.getElementById('summary-foot');
  sfoot.innerHTML='';
  var tfr=document.createElement('tr'); tfr.className='tot-row';
  tfr.innerHTML='<td class="sh">TOTALS</td>'
    +'<td id="tot-lu">0/0</td><td id="tot-mid">0/0</td><td id="tot-3">0/0</td><td id="tot-ft">0/0</td>'
    +'<td id="tot-pts">0</td><td id="tot-reb">0</td><td id="tot-ast">0</td>'
    +'<td id="tot-stl">0</td><td id="tot-blk">0</td><td id="tot-pc">0</td>'
    +'<td id="tot-to">0</td><td id="tot-wow">0</td><td id="tot-tpi" style="color:var(--gold)">0.0</td>';
  sfoot.appendChild(tfr);
}

function v(id){ return document.getElementById(id); }
function set(id,val){ var el=v(id); if(el){el.textContent=val; el.className=(el.className||'').replace(' zero','')+(val==='0'||val===0?' zero':'');} }

function refreshSummary(){
  var tlu_m=0,tlu_a=0,tmid_m=0,tmid_a=0,t3_m=0,t3_a=0,tft_m=0,tft_a=0;
  var tpts=0,treb=0,tast=0,tstl=0,tblk=0,tpc=0,tto=0,twow=0,ttpi=0;
  ROSTER.forEach(function(p){
    var s=stats[p.name];
    var lu_m=s.layup_make, lu_a=s.layup_make+s.layup_miss;
    var mid_m=s.middy_make, mid_a=s.middy_make+s.middy_miss;
    var t3_m=s.three_make, t3_a=s.three_make+s.three_miss;
    var ft_m=s.ft_make, ft_a=s.ft_make+s.ft_miss;
    var pts=calcPts(s), tpi=calcOPI(s)+calcDPI(s);
    set('su-lu-'+p.name, lu_m+'/'+lu_a);
    set('su-mid-'+p.name, mid_m+'/'+mid_a);
    set('su-3-'+p.name, t3_m+'/'+t3_a);
    set('su-ft-'+p.name, ft_m+'/'+ft_a);
    set('su-pts-'+p.name, pts);
    set('su-reb-'+p.name, s.reb);
    set('su-ast-'+p.name, s.ast);
    set('su-stl-'+p.name, s.stl);
    set('su-blk-'+p.name, s.blk);
    set('su-pc-'+p.name, s.pc);
    set('su-to-'+p.name, s.to);
    set('su-wow-'+p.name, s.wow);
    var tpiEl=v('su-tpi-'+p.name); if(tpiEl) tpiEl.textContent=tpi.toFixed(1);
    tlu_m+=lu_m; tlu_a+=lu_a; tmid_m+=mid_m; tmid_a+=mid_a;
    t3_m+=s.three_make; t3_a+=s.three_make+s.three_miss;
    tft_m+=ft_m; tft_a+=ft_a;
    tpts+=pts; treb+=s.reb; tast+=s.ast; tstl+=s.stl;
    tblk+=s.blk; tpc+=s.pc; tto+=s.to; twow+=s.wow; ttpi+=tpi;
  });
  set('tot-lu', tlu_m+'/'+tlu_a);
  set('tot-mid', tmid_m+'/'+tmid_a);
  set('tot-3', t3_m+'/'+t3_a);
  set('tot-ft', tft_m+'/'+tft_a);
  set('tot-pts',tpts); set('tot-reb',treb); set('tot-ast',tast);
  set('tot-stl',tstl); set('tot-blk',tblk); set('tot-pc',tpc);
  set('tot-to',tto); set('tot-wow',twow);
  var ttpiEl=v('tot-tpi'); if(ttpiEl) ttpiEl.textContent=ttpi.toFixed(1);
  refreshBar(tlu_m,tlu_a,tmid_m,tmid_a,t3_m,t3_a,tft_m,tft_a,treb);
}

function flashTd(tdEl,cls){
  if(!tdEl)return;
  tdEl.classList.remove('flash-g','flash-r','flash-b');
  void tdEl.offsetWidth;
  tdEl.classList.add(cls);
}

function commitStat(name,key,isMiss){
  var prev=JSON.parse(JSON.stringify(stats[name]));
  stats[name][key]++;
  gameLog.push({player:name,key:key,prev:prev,oppBefore:oppRebs});
  refreshSummary();
  // flash the tracker button cell
  var btn=document.querySelector('[data-flash="'+name+'-'+key+'"]');
  if(btn) flashTd(btn.closest('td'), key==='reb'?'flash-b':isMiss?'flash-r':'flash-g');
  v('btn-undo').disabled=false;
}

function commitOppReb(){
  gameLog.push({player:null,key:'opp_reb',oppBefore:oppRebs});
  oppRebs++;
  v('opp-reb-count').textContent=oppRebs;
  refreshSummary();
  v('btn-undo').disabled=false;
  showToast('Opp Rebound');
}

v('btn-undo').addEventListener('click',function(){
  if(!gameLog.length)return;
  var last=gameLog.pop();
  if(last.player===null){oppRebs=last.oppBefore;v('opp-reb-count').textContent=oppRebs;}
  else{stats[last.player]=last.prev;}
  refreshSummary();
  if(!gameLog.length) v('btn-undo').disabled=true;
});
v('btn-opp-reb').addEventListener('click',commitOppReb);

function refreshBar(lm,la,mm,ma,tm,ta,fm,fa,ourR){
  v('reb-ours').textContent=ourR;
  v('reb-opp').textContent=oppRebs;
  var tot=ourR+oppRebs;
  v('reb-bar').style.width=(tot===0?50:Math.round(ourR/tot*100))+'%';
  function pc(m,a){if(!a)return'';var p=m/a;return p>=0.5?'good':p>=0.33?'mid':'bad';}
  function setSh(fi,pi,m,a,lbl){
    v(fi).textContent=m+'/'+a;
    var el=v(pi); el.textContent=lbl+' '+(a?Math.round(m/a*100)+'%':'—'); el.className='pct '+pc(m,a);
  }
  setSh('sh-lu','sh-lu-p',lm,la,'LU');
  setSh('sh-mid','sh-mid-p',mm,ma,'Mid');
  setSh('sh-3','sh-3-p',tm,ta,'3PT');
  setSh('sh-ft','sh-ft-p',fm,fa,'FT');
}

// save
v('btn-save').addEventListener('click',function(){
  if(!isAuth()){showToast('Sign in first',true);return;}
  var opp=v('game-opp').value.trim();
  if(!opp){showToast('Enter opponent name',true);return;}
  var date=v('game-date').value||new Date().toISOString().slice(0,10);
  var tourn=v('game-tourn').value.trim();
  var lm=0,la=0,mm=0,ma=0,tm=0,ta=0,fm=0,fa=0,tStl=0,tTo=0,tReb=0;
  ROSTER.forEach(function(p){
    var s=stats[p.name];
    lm+=s.layup_make;la+=s.layup_make+s.layup_miss;
    mm+=s.middy_make;ma+=s.middy_make+s.middy_miss;
    tm+=s.three_make;ta+=s.three_make+s.three_miss;
    fm+=s.ft_make;fa+=s.ft_make+s.ft_miss;
    tStl+=s.stl;tTo+=s.to;tReb+=s.reb;
  });
  var fgm=lm+mm+tm,fga=la+ma+ta,pts=lm*2+mm*2+tm*3+fm;
  var game={id:Date.now(),team:TEAM,opp:opp,date:date,tournament:tourn,
    lm:lm,la:la,midm:mm,mida:ma,csm:tm,csa:ta,opm:0,opa:0,
    fm:fm,fa:fa,tcr:tStl,tco:tTo,rwc:tReb,rop:oppRebs,
    pts:pts,fgm:fgm,fga:fga,t3m:tm,t3a:ta,
    efg:fga===0?null:Math.round((fgm+0.5*tm)/fga*100)};
  var recs=ROSTER.map(function(p){
    var s=stats[p.name];
    return{team:TEAM,opp:opp,date:date,tournament:tourn,
      playerNum:p.num,playerName:p.name,
      layupm:s.layup_make,layupa:s.layup_make+s.layup_miss,
      ftm:s.ft_make,fta:s.ft_make+s.ft_miss,
      threem:s.three_make,threea:s.three_make+s.three_miss,
      midm:s.middy_make,mida:s.middy_make+s.middy_miss,
      reb:s.reb,ast:s.ast,pc:s.pc,blk:s.blk,
      tocr:s.stl,toco:s.to,wow:s.wow,
      pts:calcPts(s),oppReb:oppRebs,savedAt:Date.now()};
  });
  var btn=v('btn-save');
  btn.disabled=true;btn.textContent='Saving…';
  db.collection('games').add(game).then(function(){
    return Promise.all(recs.map(function(r){return db.collection('playerStats').add(r);}));
  }).then(function(){
    btn.disabled=false;btn.textContent='✓ Saved!';
    showToast('Saved vs '+opp+'!');
    setTimeout(function(){btn.textContent='💾 Save Game to Stats Tracker';},3000);
  }).catch(function(e){
    btn.disabled=false;btn.textContent='💾 Save Game to Stats Tracker';
    showToast('Save failed: '+e.message,true);
  });
});

function showToast(msg,err){
  var t=v('toast');
  t.textContent=msg;t.className='show'+(err?' err':'');
  clearTimeout(t._t);t._t=setTimeout(function(){t.className='';},1800);
}

v('game-date').value=new Date().toISOString().slice(0,10);
</script>
