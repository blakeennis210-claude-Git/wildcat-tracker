<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wildcats Live Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">


<style>
:root {
  --bg: #0f1117; --bg2: #1a1d27; --bg3: #242838;
  --fg: #f0f2f8; --fg2: #8b90a8;
  --accent: #4f7cff; --accent2: #7b5ea7;
  --green: #2ecc71; --red: #e74c3c; --gold: #f0a500;
  --border: rgba(255,255,255,0.08);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f0f2f8; --bg2: #ffffff; --bg3: #e4e7f0;
    --fg: #0f1117; --fg2: #5a5f78; --border: rgba(0,0,0,0.08);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f0f2f8; --bg2: #ffffff; --bg3: #e4e7f0;
  --fg: #0f1117; --fg2: #5a5f78; --border: rgba(0,0,0,0.08);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; font-size: 14px; overflow: hidden; user-select: none; }

#app {
  display: flex; flex-direction: column; height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  gap: 8px;
}

.header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.header-left { display: flex; align-items: center; gap: 10px; }
.logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.3px; }
.logo span { color: var(--accent); }
.active-stat-label { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: var(--gold); background: rgba(240,165,0,0.12); padding: 3px 10px; border-radius: 20px; display: none; }
.active-stat-label.visible { display: block; }
.btn-undo { background: var(--bg3); border: 1px solid var(--border); color: var(--fg2); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.btn-undo:active { opacity: 0.7; transform: scale(0.96); }
.btn-undo:disabled { opacity: 0.3; cursor: default; }

.section-label { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--fg2); display: flex; align-items: center; gap: 8px; }
.section-label::before, .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.shoot-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: auto auto;
  gap: 5px;
}
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }

.stat-btn {
  background: var(--bg2); border: 1.5px solid var(--border); border-radius: 10px;
  padding: 7px 4px; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 3px; transition: all 0.12s; touch-action: manipulation;
}
.stat-btn:active { transform: scale(0.94); opacity: 0.85; }
.stat-btn.active { border-color: var(--accent); background: rgba(79,124,255,0.15); box-shadow: 0 0 0 1px var(--accent); }
.stat-btn.made { border-color: var(--green); background: rgba(46,204,113,0.1); }
.stat-btn.made.active { background: rgba(46,204,113,0.2); box-shadow: 0 0 0 1px var(--green); }
.stat-btn.missed { border-color: var(--red); background: rgba(231,76,60,0.1); }
.stat-btn.missed.active { background: rgba(231,76,60,0.2); box-shadow: 0 0 0 1px var(--red); }
.stat-btn.wow-btn { border-color: var(--gold); background: rgba(240,165,0,0.08); }
.stat-btn.wow-btn.active { background: rgba(240,165,0,0.2); box-shadow: 0 0 0 1px var(--gold); }
.stat-btn .icon { font-size: 16px; line-height: 1; }
.stat-btn .label { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.3px; color: var(--fg2); text-align: center; text-transform: uppercase; }
.stat-btn.made .label { color: var(--green); }
.stat-btn.missed .label { color: var(--red); }
.stat-btn.wow-btn .label { color: var(--gold); }

/* OPP REB button */
.btn-opp-reb {
  background: rgba(231,76,60,0.15); border: 2px solid var(--red); border-radius: 12px;
  color: var(--red); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px;
  padding: 10px 0; cursor: pointer; touch-action: manipulation;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; letter-spacing: 0.3px;
}
.btn-opp-reb:active { transform: scale(0.97); background: rgba(231,76,60,0.3); }
.btn-opp-reb.flash { animation: flashOppReb 0.4s ease; }
@keyframes flashOppReb { 0%{background:rgba(231,76,60,0.15)} 30%{background:rgba(231,76,60,0.5)} 100%{background:rgba(231,76,60,0.15)} }

/* Prompt banner (rebound + assist share same style) */
.prompt-banner {
  display: none; background: rgba(79,124,255,0.18); border: 1.5px solid var(--accent);
  border-radius: 12px; padding: 10px 14px; align-items: center;
  justify-content: space-between; gap: 10px; flex-shrink: 0;
}
.prompt-banner.visible { display: flex; }
.prompt-msg { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: var(--fg); }
.prompt-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-action-blue { background: var(--accent); color: #fff; border: none; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; touch-action: manipulation; }
.btn-action-blue:active { opacity: 0.8; transform: scale(0.95); }
.btn-action-gray { background: var(--bg3); color: var(--fg2); border: 1px solid var(--border); font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 8px; cursor: pointer; touch-action: manipulation; }
.btn-action-gray:active { opacity: 0.8; }
.btn-action-red { background: rgba(231,76,60,0.15); color: var(--red); border: 1px solid var(--red); font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; touch-action: manipulation; }
.btn-action-red:active { opacity: 0.8; }

/* Player grid */
.player-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; overflow-y: auto; flex: 1; align-content: start; }
.player-card { background: var(--bg2); border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all 0.12s; touch-action: manipulation; min-height: 82px; }
.player-card:active { transform: scale(0.95); }
.player-card.flash-green { animation: flashGreen 0.4s ease; }
.player-card.flash-red { animation: flashRed 0.4s ease; }
@keyframes flashGreen { 0%{background:var(--bg2)} 30%{background:rgba(46,204,113,0.3);border-color:var(--green)} 100%{background:var(--bg2)} }
@keyframes flashRed { 0%{background:var(--bg2)} 30%{background:rgba(231,76,60,0.3);border-color:var(--red)} 100%{background:var(--bg2)} }
.player-num { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
.player-name { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; }
.player-tpi { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); letter-spacing: -0.5px; }
.player-opi-dpi { font-size: 10px; font-variant-numeric: tabular-nums; color: var(--fg2); display: flex; gap: 5px; }
.opi-val { color: #4f7cff; }
.dpi-val { color: var(--accent2); }

/* Live stats bar */
#live-bar { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.live-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.live-label { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--fg2); flex-shrink: 0; min-width: 28px; }
.reb-battle { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.reb-num { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.reb-num.ours { color: var(--green); }
.reb-num.opp { color: var(--red); }
.reb-bar-wrap { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; min-width: 0; }
.reb-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; background: linear-gradient(90deg, var(--green), var(--accent)); }
.shot-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; }
.shot-stat { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.shot-stat .frac { color: var(--fg); }
.shot-stat .pct { font-size: 10px; font-weight: 500; }
.shot-stat .pct.good { color: var(--green); }
.shot-stat .pct.mid-pct { color: var(--gold); }
.shot-stat .pct.bad { color: var(--red); }
.shot-sep { color: var(--border); font-size: 14px; }

/* Log panel */
#log-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 1px solid var(--border); border-radius: 20px 20px 0 0; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); z-index: 100; max-height: 60vh; display: flex; flex-direction: column; gap: 10px; }
#log-panel.open { transform: translateY(0); }
.log-header { display: flex; align-items: center; justify-content: space-between; }
.log-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; }
.btn-close-log { background: var(--bg3); border: none; color: var(--fg); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
#log-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.log-entry { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg3); border-radius: 8px; font-size: 13px; }
.log-entry .log-player { font-weight: 600; font-family: 'Space Grotesk', sans-serif; }
.log-entry .log-stat { color: var(--fg2); font-size: 12px; }
.log-time { font-size: 11px; color: var(--fg2); margin-left: auto; font-variant-numeric: tabular-nums; }
#btn-log { background: var(--bg3); border: 1px solid var(--border); color: var(--fg2); font-size: 12px; font-weight: 500; font-family: 'Inter', sans-serif; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
#overlay.visible { display: block; }
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">Wild<span>cats</span></div>
      <div class="active-stat-label" id="active-label"></div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="btn-log">📋 Log</button>
      <button class="btn-undo" id="btn-undo" disabled>↩ Undo</button>
    </div>
  </div>

  <!-- Shooting grid -->
  <div class="section-label">Shooting</div>
  <div class="shoot-grid">
    <button class="stat-btn made" data-stat="layup_make"><div class="icon">🟢</div><div class="label">Layup ✓</div></button>
    <button class="stat-btn made" data-stat="middy_make"><div class="icon">🟢</div><div class="label">Mid ✓</div></button>
    <button class="stat-btn made" data-stat="three_make"><div class="icon">🟢</div><div class="label">3PT ✓</div></button>
    <button class="stat-btn made" data-stat="ft_make"><div class="icon">🟢</div><div class="label">FT ✓</div></button>
    <button class="stat-btn missed" data-stat="layup_miss"><div class="icon">🔴</div><div class="label">Layup ✗</div></button>
    <button class="stat-btn missed" data-stat="middy_miss"><div class="icon">🔴</div><div class="label">Mid ✗</div></button>
    <button class="stat-btn missed" data-stat="three_miss"><div class="icon">🔴</div><div class="label">3PT ✗</div></button>
    <button class="stat-btn missed" data-stat="ft_miss"><div class="icon">🔴</div><div class="label">FT ✗</div></button>
  </div>

  <!-- Other stats -->
  <div class="section-label">Other</div>
  <div class="stat-grid">
    <button class="stat-btn" data-stat="reb"><div class="icon">💪</div><div class="label">Reb</div></button>
    <button class="stat-btn" data-stat="ast"><div class="icon">🤝</div><div class="label">Assist</div></button>
    <button class="stat-btn" data-stat="stl"><div class="icon">🫳</div><div class="label">Steal</div></button>
    <button class="stat-btn" data-stat="blk"><div class="icon">🛡️</div><div class="label">Block</div></button>
    <button class="stat-btn" data-stat="pc"><div class="icon">⚡</div><div class="label">PC</div></button>
    <button class="stat-btn" data-stat="to"><div class="icon">❌</div><div class="label">TO</div></button>
    <button class="stat-btn wow-btn" data-stat="wow" style="grid-column:span 2"><div class="icon">⭐</div><div class="label">WOW</div></button>
  </div>

  <!-- OPP REB big red button -->
  <button class="btn-opp-reb" id="btn-opp-reb">🔴 OPP REBOUND</button>

  <!-- Rebound prompt (shown after any miss) -->
  <div class="prompt-banner" id="reb-prompt">
    <div class="prompt-msg" id="reb-msg">Who rebounded?</div>
    <div class="prompt-actions">
      <button class="btn-action-gray" id="btn-reb-player">👇 Our player</button>
      <button class="btn-action-red" id="btn-reb-opp">🔴 OPP</button>
      <button class="btn-action-gray" id="btn-reb-skip">Skip</button>
    </div>
  </div>

  <!-- Assist prompt (shown after any make) -->
  <div class="prompt-banner" id="assist-prompt">
    <div class="prompt-msg" id="assist-msg">Assist on that basket?</div>
    <div class="prompt-actions">
      <button class="btn-action-blue" id="btn-assist-yes">+ Assist</button>
      <button class="btn-action-gray" id="btn-assist-no">No Assist</button>
    </div>
  </div>

  <div class="section-label" id="player-section-label">Players — tap to assign stat</div>
  <div class="player-grid" id="player-grid"></div>

  <!-- Live stats bar -->
  <div id="live-bar">
    <div class="live-row">
      <div class="live-label">REB</div>
      <div class="reb-battle">
        <div class="reb-num ours" id="reb-ours">0</div>
        <div class="reb-bar-wrap"><div class="reb-bar-fill" id="reb-bar" style="width:50%"></div></div>
        <div class="reb-num opp" id="reb-opp">0</div>
      </div>
    </div>
    <div class="live-row">
      <div class="live-label">FG</div>
      <div class="shot-line" id="shot-line">
        <span class="shot-stat"><span class="frac" id="sh-layup">0/0</span> <span class="pct" id="sh-layup-pct">Layup —</span></span>
        <span class="shot-sep">·</span>
        <span class="shot-stat"><span class="frac" id="sh-mid">0/0</span> <span class="pct" id="sh-mid-pct">Mid —</span></span>
        <span class="shot-sep">·</span>
        <span class="shot-stat"><span class="frac" id="sh-3">0/0</span> <span class="pct" id="sh-3-pct">3PT —</span></span>
        <span class="shot-sep">·</span>
        <span class="shot-stat"><span class="frac" id="sh-ft">0/0</span> <span class="pct" id="sh-ft-pct">FT —</span></span>
      </div>
    </div>
  </div>
</div>

<div id="overlay"></div>
<div id="log-panel">
  <div class="log-header">
    <div class="log-title">Game Log</div>
    <button class="btn-close-log" id="btn-close-log">×</button>
  </div>
  <div id="log-list"></div>
</div>

<script>
const ROSTER = [
  { num: '00', name: 'Everly' },
  { num: '2',  name: 'Izzy' },
  { num: '5',  name: 'Bella' },
  { num: '7',  name: 'Mac' },
  { num: '10', name: 'Maria' },
  { num: '12', name: 'Laylah' },
  { num: '21', name: 'Jazzy' },
  { num: '23', name: 'El' },
  { num: '24', name: 'Arya' },
  { num: '25', name: 'Twin' },
  { num: '30', name: 'Avarie' },
];

const STAT_LABELS = {
  layup_make:'Layup ✓', layup_miss:'Layup ✗',
  middy_make:'Mid ✓',   middy_miss:'Mid ✗',
  three_make:'3PT ✓',   three_miss:'3PT ✗',
  ft_make:'FT ✓',      ft_miss:'FT ✗',
  reb:'Rebound', ast:'Assist', stl:'Steal',
  blk:'Block', pc:'Play Creation', to:'Turnover', wow:'WOW',
  opp_reb:'Opp Rebound'
};

const MADE_SHOTS = new Set(['layup_make','middy_make','three_make']);
const MISS_SHOTS = new Set(['layup_miss','middy_miss','three_miss','ft_miss']);

let stats = {};
ROSTER.forEach(p => {
  stats[p.name] = {
    layup_make:0, layup_miss:0, middy_make:0, middy_miss:0,
    three_make:0, three_miss:0, ft_make:0, ft_miss:0,
    reb:0, ast:0, stl:0, blk:0, pc:0, to:0, wow:0
  };
});

let oppRebs = 0;
let activeStat = null;
let history = [];

// Flow states
let awaitingAssist = false;
let lastScorerName = null;
let awaitingRebound = false; // waiting for player tap after prompt
let reboundPending = false;  // prompt visible, waiting for button choice

function calcPts(s) { return s.layup_make*2+s.three_make*3+s.middy_make*2+s.ft_make; }
function calcOPI(s) { return calcPts(s)+s.ast*0.5+s.pc*1.0-s.to*1.0; }
function calcDPI(s) { return s.reb*1.0+s.stl*1.2+s.blk*1.2+s.wow*2.0; }

// Build player cards
const grid = document.getElementById('player-grid');
ROSTER.forEach(p => {
  const card = document.createElement('div');
  card.className = 'player-card';
  card.dataset.name = p.name;
  card.innerHTML = `<div class="player-num">#${p.num}</div><div class="player-name">${p.name}</div><div class="player-tpi" id="tpi-${p.name}">0.0</div><div class="player-opi-dpi"><span class="opi-val" id="opi-${p.name}">O:0.0</span><span class="dpi-val" id="dpi-${p.name}">D:0.0</span></div>`;
  card.addEventListener('click', () => onPlayerTap(p.name));
  grid.appendChild(card);
});

function updatePlayerUI(name) {
  const s = stats[name];
  const opi = calcOPI(s), dpi = calcDPI(s), tpi = opi+dpi;
  document.getElementById(`tpi-${name}`).textContent = tpi.toFixed(1);
  document.getElementById(`opi-${name}`).textContent = `O:${opi.toFixed(1)}`;
  document.getElementById(`dpi-${name}`).textContent = `D:${dpi.toFixed(1)}`;
}

function flashCard(name, isNeg) {
  const card = document.querySelector(`.player-card[data-name="${name}"]`);
  card.classList.remove('flash-green','flash-red');
  void card.offsetWidth;
  card.classList.add(isNeg ? 'flash-red' : 'flash-green');
}

function commitStat(playerName, stat) {
  const prev = JSON.parse(JSON.stringify(stats[playerName]));
  stats[playerName][stat]++;
  history.push({ player: playerName, stat, prev, oppRebsBefore: oppRebs, time: new Date() });
  updatePlayerUI(playerName);
  addLogEntry(playerName, stat);
  flashCard(playerName, stat==='to'||stat.endsWith('_miss'));
  updateLiveBar();
  document.getElementById('btn-undo').disabled = false;
}

function commitOppReb() {
  const prevOpp = oppRebs;
  oppRebs++;
  history.push({ player: null, stat: 'opp_reb', oppRebsBefore: prevOpp, time: new Date() });
  updateLiveBar();
  addLogEntry('OPP', 'opp_reb');
  document.getElementById('btn-undo').disabled = false;
}

function onPlayerTap(playerName) {
  // Rebound flow: waiting for player selection
  if (awaitingRebound) {
    commitStat(playerName, 'reb');
    endReboundFlow();
    return;
  }
  // Assist flow
  if (awaitingAssist) {
    if (playerName === lastScorerName) return;
    commitStat(playerName, 'ast');
    endAssistFlow();
    return;
  }
  if (!activeStat) return;

  const isMade = MADE_SHOTS.has(activeStat);
  const isMiss = MISS_SHOTS.has(activeStat);

  commitStat(playerName, activeStat);
  clearActiveStat();

  if (isMade) {
    lastScorerName = playerName;
    awaitingAssist = true;
    document.getElementById('assist-msg').textContent = `${playerName} scored — assist?`;
    document.getElementById('assist-prompt').classList.add('visible');
    document.getElementById('player-section-label').textContent = 'Tap assisting player';
  } else if (isMiss) {
    reboundPending = true;
    document.getElementById('reb-msg').textContent = 'Who got the rebound?';
    document.getElementById('reb-prompt').classList.add('visible');
    document.getElementById('player-section-label').textContent = 'Tap our player who rebounded';
  }
}

// Rebound flow
function startPlayerRebound() {
  // User tapped "Our player" — now wait for player tap
  document.getElementById('reb-prompt').classList.remove('visible');
  reboundPending = false;
  awaitingRebound = true;
  document.getElementById('player-section-label').textContent = '👇 Tap the player who rebounded';
}

function endReboundFlow() {
  awaitingRebound = false;
  reboundPending = false;
  document.getElementById('reb-prompt').classList.remove('visible');
  document.getElementById('player-section-label').textContent = 'Players — tap to assign stat';
}

// Assist flow
function endAssistFlow() {
  awaitingAssist = false; lastScorerName = null;
  document.getElementById('assist-prompt').classList.remove('visible');
  document.getElementById('player-section-label').textContent = 'Players — tap to assign stat';
}

// Rebound prompt buttons
document.getElementById('btn-reb-player').addEventListener('click', startPlayerRebound);
document.getElementById('btn-reb-opp').addEventListener('click', () => {
  commitOppReb();
  const btn = document.getElementById('btn-opp-reb');
  btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
  endReboundFlow();
});
document.getElementById('btn-reb-skip').addEventListener('click', endReboundFlow);

// Assist prompt buttons
document.getElementById('btn-assist-yes').addEventListener('click', () => {
  document.getElementById('assist-msg').textContent = 'Tap assisting player ↓';
});
document.getElementById('btn-assist-no').addEventListener('click', endAssistFlow);

// OPP REB standalone button
document.getElementById('btn-opp-reb').addEventListener('click', () => {
  commitOppReb();
  const btn = document.getElementById('btn-opp-reb');
  btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
});

// Stat buttons
const statBtns = document.querySelectorAll('.stat-btn');
statBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    if (awaitingAssist || awaitingRebound || reboundPending) return;
    const stat = btn.dataset.stat;
    if (activeStat === stat) { clearActiveStat(); return; }
    statBtns.forEach(b => b.classList.remove('active'));
    activeStat = stat;
    btn.classList.add('active');
    document.getElementById('active-label').textContent = `${STAT_LABELS[stat]} → tap player`;
    document.getElementById('active-label').classList.add('visible');
  });
});

function clearActiveStat() {
  statBtns.forEach(b => b.classList.remove('active'));
  activeStat = null;
  document.getElementById('active-label').classList.remove('visible');
}

// Undo
document.getElementById('btn-undo').addEventListener('click', () => {
  if (awaitingAssist) endAssistFlow();
  if (awaitingRebound || reboundPending) endReboundFlow();
  if (!history.length) return;
  const last = history.pop();
  if (last.player === null) {
    oppRebs = last.oppRebsBefore;
  } else {
    stats[last.player] = last.prev;
    updatePlayerUI(last.player);
  }
  updateLiveBar();
  removeLastLogEntry();
  if (!history.length) document.getElementById('btn-undo').disabled = true;
});

// Live bar
function updateLiveBar() {
  let ourRebs = 0;
  ROSTER.forEach(p => { ourRebs += stats[p.name].reb; });
  document.getElementById('reb-ours').textContent = ourRebs;
  document.getElementById('reb-opp').textContent = oppRebs;
  const total = ourRebs + oppRebs;
  const pct = total === 0 ? 50 : Math.round((ourRebs/total)*100);
  document.getElementById('reb-bar').style.width = pct + '%';

  let lm=0,la=0,mm=0,ma=0,tm=0,ta=0,fm=0,fa=0;
  ROSTER.forEach(p => {
    const s = stats[p.name];
    lm+=s.layup_make; la+=s.layup_make+s.layup_miss;
    mm+=s.middy_make; ma+=s.middy_make+s.middy_miss;
    tm+=s.three_make; ta+=s.three_make+s.three_miss;
    fm+=s.ft_make;    fa+=s.ft_make+s.ft_miss;
  });

  function pctClass(m,a) {
    if (!a) return '';
    const p=m/a;
    return p>=0.5?'good':p>=0.33?'mid-pct':'bad';
  }
  function set(fracId,pctId,m,a,label) {
    document.getElementById(fracId).textContent=`${m}/${a}`;
    const p=a?Math.round(m/a*100):null;
    const el=document.getElementById(pctId);
    el.textContent=`${label} ${p===null?'—':p+'%'}`;
    el.className='pct '+pctClass(m,a);
  }
  set('sh-layup','sh-layup-pct',lm,la,'Layup');
  set('sh-mid','sh-mid-pct',mm,ma,'Mid');
  set('sh-3','sh-3-pct',tm,ta,'3PT');
  set('sh-ft','sh-ft-pct',fm,fa,'FT');
}

// Log
const logList = document.getElementById('log-list');
function addLogEntry(player,stat) {
  const entry=document.createElement('div');
  entry.className='log-entry';
  const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  entry.innerHTML=`<span class="log-player">${player}</span><span class="log-stat">${STAT_LABELS[stat]||stat}</span><span class="log-time">${t}</span>`;
  logList.prepend(entry);
}
function removeLastLogEntry() { if(logList.firstChild) logList.removeChild(logList.firstChild); }

const logPanel=document.getElementById('log-panel');
const overlay=document.getElementById('overlay');
document.getElementById('btn-log').addEventListener('click',()=>{ logPanel.classList.add('open'); overlay.classList.add('visible'); });
document.getElementById('btn-close-log').addEventListener('click',closeLog);
overlay.addEventListener('click',closeLog);
function closeLog(){ logPanel.classList.remove('open'); overlay.classList.remove('visible'); }
</script>
</body>
</html>
